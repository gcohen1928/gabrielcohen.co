<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pictures — gabe cohen</title>
  <meta name="description" content="Pictures by Gabe Cohen." />
  <link rel="canonical" href="https://gabrielcohen.co/photos.html" />
  <meta name="theme-color" content="#ecebe6" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="preload" href="/assets/fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: "Source Serif"; src: url("/assets/fonts/source-serif-4.woff2") format("woff2"); font-weight: 200 900; font-display: swap; }
    @font-face { font-family: "Martian Mono"; src: url("/assets/fonts/martian-mono.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; font-display: swap; }

    :root {
      --paper: #ecebe6;
      --ink: #161616;
      --soft: #6e6c66;
      --line: #c9c7bf;
      --gap: clamp(6px, 0.8vw, 12px);
      --ease: cubic-bezier(0.2, 0.9, 0.1, 1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.125rem/1.55 "Source Serif", Georgia, serif; -webkit-font-smoothing: antialiased; }
    ::selection { background: var(--ink); color: var(--paper); }
    a { color: inherit; text-decoration: underline 1px var(--line); text-underline-offset: 0.2em; }
    a:hover, a:focus-visible { background: var(--ink); color: var(--paper); text-decoration: none; outline: none; }
    .mono { font-family: "Martian Mono", ui-monospace, monospace; font-stretch: 87.5%; font-size: 0.75rem; letter-spacing: 0.02em; }

    .wrap { max-width: 88rem; margin: 0 auto; padding: clamp(1.5rem, 4vw, 3.5rem); container-type: inline-size; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: clamp(1.5rem, 4vw, 3rem); }
    h1 { margin: 0; font-size: clamp(2.4rem, 1.6rem + 2.4vw, 3.4rem); font-weight: 400; line-height: 1.05; letter-spacing: -0.025em; }
    header .mono { color: var(--soft); }

    /* A rectangular mosaic on six columns. A normal tile is 2 columns by 1 row at 3:2;
       .big is 4 by 2 (also 3:2) and .tall is 2 by 2. The order below fills every cell. */
    .mosaic {
      --col: calc((100cqi - 5 * var(--gap)) / 6);
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-auto-rows: calc(var(--col) * 4 / 3);
      grid-auto-flow: dense;
      gap: var(--gap);
      margin: 0; padding: 0; list-style: none;
      transition: opacity 0.5s var(--ease), filter 0.5s var(--ease);
    }
    .tile { grid-column: span 2; position: relative; overflow: hidden; background: #d9d7d0; }
    .tile.big { grid-column: span 4; grid-row: span 2; }
    .tile.tall { grid-row: span 2; }
    .tile button { all: unset; display: block; width: 100%; height: 100%; cursor: zoom-in; }
    .tile button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 0.9s var(--ease); }
    .tile:hover img { transform: scale(1.04); }
    .viewing .mosaic { opacity: 0.18; filter: grayscale(1); }
    .tile.lifted { visibility: hidden; }

    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.985); } }
    .tile { animation: rise 0.9s var(--ease) both; animation-delay: calc(var(--i) * 60ms); }

    @container (max-width: 700px) {
      .mosaic { --col: calc((100cqi - var(--gap)) / 2); grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: calc(var(--col) * 2 / 3); }
      .tile { grid-column: span 1; }
      .tile.big { grid-column: span 2; grid-row: span 2; }
      .tile.tall { grid-column: span 1; grid-row: span 2; }
    }

    /* The viewer: the clicked photo grows out of its tile to fill the screen. */
    .viewer { position: fixed; inset: 0; z-index: 10; }
    .viewer[hidden] { display: none; }
    .viewer .shade { position: absolute; inset: 0; background: var(--paper); opacity: 0; cursor: zoom-out; }
    .viewer .photo { position: fixed; margin: 0; object-fit: cover; cursor: zoom-out; }
    .viewer .bar {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 1rem;
      padding: 1rem clamp(1rem, 3vw, 2rem) calc(1rem + env(safe-area-inset-bottom, 0px));
      opacity: 0; transform: translateY(8px); transition: opacity 0.35s, transform 0.35s var(--ease);
    }
    .viewer.ready .bar { opacity: 1; transform: none; }
    .viewer .cap { flex: 1; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .viewer .count { margin-right: auto; }
    .viewer .count { color: var(--soft); }
    .viewer button.ctl { all: unset; cursor: pointer; font-family: "Martian Mono", ui-monospace, monospace; font-size: 0.8125rem; padding: 0.4rem 0.6rem; }
    .viewer button.ctl:hover, .viewer button.ctl:focus-visible { background: var(--ink); color: var(--paper); }

    @media (prefers-reduced-motion: reduce) {
      .tile { animation: none; }
      .tile img, .mosaic, .viewer .bar { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>pictures</h1>
      <a class="mono" href="/">← back</a>
    </header>

    <ul class="mosaic" id="mosaic">
      <li class="tile big" style="--i:0"><button type="button"><img src="/assets/photos/thumb/shiba.webp" data-full="/assets/photos/shiba.webp" width="900" height="600" alt="A shiba inu lying on a herringbone wood floor beside a woman working on a laptop, while a man walks past shelves in a bright shop." /></button></li>
      <li class="tile" style="--i:1"><button type="button"><img src="/assets/photos/thumb/wake.webp" data-full="/assets/photos/wake.webp" width="900" height="600" alt="A boat's wake stretching back across grey water toward a small island under heavy cloud." /></button></li>
      <li class="tile" style="--i:2"><button type="button"><img src="/assets/photos/thumb/palacio.webp" data-full="/assets/photos/palacio.webp" width="900" height="600" alt="Two people embracing in a plaza in front of the Palacio Nacional, one holding a baby wrapped in a printed blanket, with pigeons at their feet." /></button></li>
      <li class="tile tall" style="--i:3"><button type="button"><img src="/assets/photos/thumb/lake.webp" data-full="/assets/photos/lake.webp" width="600" height="900" alt="A crater lake ringed by green hills, seen from above past a red corrugated roof, with torn cloth hanging at the top of the frame." /></button></li>
      <li class="tile" style="--i:4"><button type="button"><img src="/assets/photos/thumb/volcano.webp" data-full="/assets/photos/volcano.webp" width="900" height="600" loading="lazy" alt="A cone-shaped volcano under heavy cloud, with a forested ridge and a small village in the valley below." /></button></li>
      <li class="tile" style="--i:5"><button type="button"><img src="/assets/photos/thumb/model.webp" data-full="/assets/photos/model.webp" width="900" height="600" loading="lazy" alt="A dusty model of volcanoes on a table in a wood-paneled room, with a stuffed squirrel on a branch and a few jars behind it." /></button></li>
      <li class="tile big" style="--i:6"><button type="button"><img src="/assets/photos/thumb/garden-court.webp" data-full="/assets/photos/garden-court.webp" width="900" height="600" loading="lazy" alt="A grand hotel dining room under a glass dome, with crystal chandeliers, marble columns and empty tables." /></button></li>
      <li class="tile" style="--i:7"><button type="button"><img src="/assets/photos/thumb/R0000079.webp" data-full="/assets/photos/R0000079.webp" width="900" height="600" loading="lazy" alt="A cat silhouetted in a lit window at night." /></button></li>
      <li class="tile" style="--i:8"><button type="button"><img src="/assets/photos/thumb/R0009319.webp" data-full="/assets/photos/R0009319.webp" width="900" height="600" loading="lazy" alt="A white dog and a golden retriever meeting on a sunny park lawn." /></button></li>
      <li class="tile" style="--i:9"><button type="button"><img src="/assets/photos/thumb/R0009331-preview.webp" data-full="/assets/photos/R0009331-preview.webp" width="900" height="600" loading="lazy" alt="The rounded corner of an old building glowing orange at night." /></button></li>
      <li class="tile" style="--i:10"><button type="button"><img src="/assets/photos/thumb/R0009339-preview.webp" data-full="/assets/photos/R0009339-preview.webp" width="900" height="600" loading="lazy" alt="A red pickup truck parked in front of a lit house at night." /></button></li>
    </ul>
  </div>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo" hidden>
    <div class="shade" id="shade"></div>
    <img class="photo" id="photo" width="1600" height="1067" alt="Enlarged photo" />
    <div class="bar">
      <p class="cap" id="cap"></p>
      <span class="mono count" id="count"></span>
      <button class="ctl" id="prev" type="button" aria-label="Previous photo">←</button>
      <button class="ctl" id="next" type="button" aria-label="Next photo">→</button>
      <button class="ctl" id="close" type="button" aria-label="Close">close</button>
    </div>
  </div>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const tiles = [...document.querySelectorAll('.tile')];
    const viewer = $('viewer'), shade = $('shade'), photo = $('photo');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DUR = reduced ? 0 : 650, EASE = 'cubic-bezier(0.2, 0.9, 0.1, 1)';
    let index = -1, busy = false, opener = null;

    const imgOf = i => tiles[i].querySelector('img');
    const box = r => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });

    // The largest rectangle with the photo's own aspect that fits above the caption bar.
    function fit(img) {
      const ar = img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : img.width / img.height;
      const pad = Math.max(16, Math.min(innerWidth, innerHeight) * 0.04), bar = 64;
      const aw = innerWidth - pad * 2, ah = innerHeight - pad - bar;
      let w = aw, h = w / ar;
      if (h > ah) { h = ah; w = h * ar; }
      return { left: (innerWidth - w) / 2, top: pad + (ah - h) / 2, width: w, height: h };
    }

    function label(i) {
      const img = imgOf(i);
      $('cap').textContent = img.alt;
      $('count').textContent = `${i + 1} / ${tiles.length}`;
      photo.alt = img.alt;
    }

    // Show the grid image at once, then swap in the full-size file when it arrives.
    function load(i) {
      const img = imgOf(i), full = new Image();
      photo.src = img.currentSrc || img.src;
      full.src = img.dataset.full;
      full.decode().then(() => { if (index === i) photo.src = full.src; }).catch(() => {});
    }

    async function open(i) {
      if (busy) return; busy = true; index = i; opener = tiles[i].querySelector('button');
      const from = tiles[i].getBoundingClientRect();
      label(i); load(i);
      Object.assign(photo.style, box(from));
      viewer.hidden = false; document.documentElement.style.overflow = 'hidden';
      document.body.classList.add('viewing'); tiles[i].classList.add('lifted');
      const to = fit(imgOf(i));
      shade.animate([{ opacity: 0 }, { opacity: 0.94 }], { duration: DUR, easing: EASE, fill: 'forwards' });
      await photo.animate([box(from), box(to)], { duration: DUR, easing: EASE }).finished.catch(() => {});
      Object.assign(photo.style, box(to));
      viewer.classList.add('ready'); $('close').focus({ preventScroll: true });
      busy = false;
    }

    async function close() {
      if (busy || index < 0) return; busy = true;
      const i = index, to = tiles[i].getBoundingClientRect(), from = photo.getBoundingClientRect();
      viewer.classList.remove('ready'); document.body.classList.remove('viewing');
      shade.animate([{ opacity: 0.94 }, { opacity: 0 }], { duration: DUR * 0.85, easing: EASE, fill: 'forwards' });
      await photo.animate([box(from), box(to)], { duration: DUR * 0.85, easing: EASE }).finished.catch(() => {});
      tiles[i].classList.remove('lifted');
      viewer.hidden = true; document.documentElement.style.overflow = ''; photo.removeAttribute('src');
      index = -1; busy = false; opener?.focus({ preventScroll: true });
    }

    async function step(dir) {
      if (busy || index < 0) return; busy = true;
      const next = (index + dir + tiles.length) % tiles.length;
      const shift = Math.min(80, innerWidth * 0.06) * dir;
      await photo.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-shift}px) scale(0.98)` }], { duration: reduced ? 0 : 220, easing: 'ease-in' }).finished.catch(() => {});
      tiles[index].classList.remove('lifted'); tiles[next].classList.add('lifted');
      index = next; label(next); load(next);
      Object.assign(photo.style, box(fit(imgOf(next))));
      await photo.animate([{ opacity: 0, transform: `translateX(${shift}px) scale(0.98)` }, { opacity: 1, transform: 'none' }], { duration: reduced ? 0 : 420, easing: EASE }).finished.catch(() => {});
      busy = false;
    }

    tiles.forEach((t, i) => t.querySelector('button').addEventListener('click', () => open(i)));
    shade.addEventListener('click', close); photo.addEventListener('click', close); $('close').addEventListener('click', close);
    $('prev').addEventListener('click', () => step(-1)); $('next').addEventListener('click', () => step(1));
    addEventListener('keydown', e => {
      if (viewer.hidden) return;
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
      else if (e.key === 'Tab') {
        const f = [$('prev'), $('next'), $('close')], k = f.indexOf(document.activeElement);
        e.preventDefault(); f[(k + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      }
    });
    addEventListener('resize', () => { if (index >= 0 && !busy) Object.assign(photo.style, box(fit(imgOf(index)))); });

    // Swipe left or right on a phone to change photos.
    let sx = null;
    viewer.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
    viewer.addEventListener('touchend', e => {
      if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    });
  })();
  </script>
</body>
</html>
